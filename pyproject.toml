# YuHuang Backend - Speech Recognition + LLM Optimization Service
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "yuhuang-backend"
version = "0.2.0"
description = "YuHuang voice input method backend: FunASR + VAD + LLM optimization"
requires-python = ">=3.11"
dependencies = [
    "funasr>=1.2.7",
    # FunASR extracts fbank features through torchaudio; without it (and
    # without the kaldi-native-fbank fallback) every generate() call raises
    # ImportError and recognition silently returns empty text.
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "numpy>=1.24.0",
    "httpx>=0.27.0",
    "pynput>=1.7.7",
    "sounddevice>=0.5.1",
    "pyyaml>=6.0",
    "onnxruntime>=1.20",
    "scipy>=1.10",
    "websockets>=14",
]

[project.optional-dependencies]
# Amazon Bedrock as the cleanup LLM (llm.base_url: bedrock:<region>)
bedrock = ["boto3>=1.34"]

[project.scripts]
yuhuang-backend = "backend.main:main"
yuhuang-ctl = "tools.yuhuang_ctl:main"

[tool.setuptools.packages.find]
where = ["src"]
