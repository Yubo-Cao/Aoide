# Aoide backend - speech recognition and optional LLM cleanup
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aoide-backend"
version = "0.2.0"
description = "Aoide fcitx5 voice input backend: FunASR, cloud ASR, and LLM cleanup"
requires-python = ">=3.11"
dependencies = [
    "funasr>=1.2.7",
    # FunASR extracts fbank features through torchaudio; without it (and
    # without the kaldi-native-fbank fallback) every generate() call raises
    # ImportError and recognition silently returns empty text.
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "numpy>=1.24.0",
    "httpx>=0.27.0",
    "pynput>=1.7.7",
    "sounddevice>=0.5.1",
    "pyyaml>=6.0",
    "onnxruntime>=1.20",
    "scipy>=1.10",
    "websockets>=14",
]

[project.optional-dependencies]
# Amazon Bedrock as the cleanup LLM (llm.base_url: bedrock:<region>)
bedrock = ["boto3>=1.34"]
gui = ["PyQt6>=6.4"]

[project.scripts]
aoide-backend = "backend.main:main"
aoide-ctl = "tools.aoide_ctl:main"
aoide-settings = "tools.aoide_settings:main"

[tool.setuptools.packages.find]
where = ["src"]
