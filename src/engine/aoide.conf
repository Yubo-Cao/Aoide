## Aoide 语音输入法配置
#
# 在 fcitx5-configtool 中可图形化编辑此文件
# 修改后需重新加载 fcitx5: fcitx5 -r
#
# 注意：fcitx5 的 addon 配置没有节名，选项直接写在根层级。加上 [Aoide]
# 这样的节头会让 readAsIni 把它们读成一个嵌套组，根层级为空，addon 于是
# 全部回落到编译期默认值。
# 触发键
# Hold 模式：按住此键说话，松手自动上屏（普通键盘）
# Toggle 模式：按一下开始，再按一下结束（Free3 等脉冲小键盘）
# ★ 引擎已支持修饰键组合（按 sym+states 精确匹配，不会误吞单键）。
# 默认 Ctrl+Alt+Y：避开常见的窗口关闭键，可在 KDE 中调整。
# Type=Key
# AllowModifierOnly=True
# AllowModifierLess=True
# fcitx5 将 KeyListOption 保存为文件末尾的 [TriggerKey] 列表。

# 触发模式
# Hold = 按住说话，松手上屏（普通键盘按住式触发）
# Toggle = 按一下开始，再按一下结束（Free3 等脉冲式蓝牙小键盘：
#         按下即发 press+release 脉冲，物理上无法表达"按住"）
# Type=Enum
# Enum0=Hold
# Enum1=Toggle
TriggerMode=Hold

# 检查系统快捷键冲突
# 若触发键与 GNOME/KDE 系统快捷键有冲突，输出警告
# Type=Boolean
CheckConflicts=true

# 后端 Unix Socket 路径
# Python 后端服务监听的 socket 路径
# Type=String
BackendSocket=auto

# VAD 静音超时 (毫秒)
# 用户停止说话多久后，判定为一段语音结束
# Type=Integer
# Min=100
# Max=5000
VADSilenceTimeout=800

# ASR 中间结果刷新间隔 (毫秒)
# 语音识别过程中，预编辑文字更新的频率
# Type=Integer
# Min=50
# Max=2000
ASRIntermediateInterval=300

# 麦克风设备名称
# 留空 = 使用系统默认输入设备
# 指定名称 = 使用特定麦克风
# 查看设备: aoide-ctl mic
# 快捷设置: aoide-ctl mic "<设备名关键词>"
# 修改后即时生效，无需重启后端
# Type=String
AudioDevice=

# ---- 悬浮面板显示 ----
# 三区草稿统一显示在 fcitx 自己的悬浮框里（不再嵌在应用光标处），
# 因为各应用对内嵌格式的支持参差不齐。悬浮框不会自动折行，宽度和
# 行数由下面两项控制。

# 每行宽度 (显示列数，一个汉字算 2 列)
# 48 列约等于 24 个汉字
# Type=Integer
# Min=10
# Max=200
PanelLineWidth=48

# 最多显示几行
# 超出后丢掉最上面的行（那部分即将上屏），首行前显示省略号
# Type=Integer
# Min=1
# Max=30
PanelMaxLines=6

# 自绘悬浮窗字号（磅）
# 仅自绘悬浮窗生效；回退到候选栏时字号跟 fcitx 主题走
# Type=Integer
# Min=8
# Max=40
PanelFontSize=14

# ---- LLM 智能优化配置 ----
# 以下配置将通过后端发送给 LLM 服务

# 启用 LLM 优化
# 需配合运行中的 LLM 后端服务 (vLLM/Ollama)
# Type=Boolean
LLMEnabled=false

# LLM API 地址 (OpenAI 兼容)
# Type=String
LLMBaseUrl=http://localhost:8000/v1

# LLM API 密钥
# Type=String
LLMApiKey=

# LLM 模型名称
# Type=String
LLMModel=qwen2.5-7b-instruct

# LLM 温度 (0~100, 如 30=0.30)
# 越低越确定，越高越创造性
# Type=Integer
# Min=0
# Max=100
LLMTemperature=30

# LLM 最大输出 Token 数
# Type=Integer
# Min=64
# Max=8192
LLMMaxTokens=2000

# LLM 优化延迟 (毫秒)
# 语音结束后，等待多久再开始 LLM 优化
# 给 ASR 更多时间生成完整结果
# Type=Integer
# Min=0
# Max=5000
LLMOptimizeDelay=500

# LLM 自动上屏延迟 (毫秒)
# LLM 优化完成后，等待多久后自动上屏
# Type=Integer
# Min=0
# Max=3000
LLMAutoCommitDelay=200

[TriggerKey]
0=Control+Alt+Y
