# YuHuang Backend Configuration
# LLM settings can be overridden via fcitx5 GUI (TriggerKey, LLMBaseUrl, etc.)

backend:
  # Unix Domain Socket path (must match fcitx5 plugin config)
  socket_path: /tmp/yuhuang-backend.sock

  # Log level: DEBUG, INFO, WARNING, ERROR
  log_level: INFO

# Audio capture settings
audio:
  # Sample rate (Hz)
  sample_rate: 16000
  # Number of channels
  channels: 1
  # Frame size in samples (300ms @ 16kHz)
  frame_size: 4800
  # Audio device name or ID (leave empty for default)
  device: ""

# VAD (Voice Activity Detection) settings
vad:
  # Silence timeout in seconds before segment finalization
  silence_timeout: 0.8
  # Volume threshold (RMS normalized) — 调低以适应低灵敏度麦克风
  volume_threshold: 0.003
  # Leading silence tolerance (seconds before first speech)
  leading_silence_timeout: 3.0

# ASR (Automatic Speech Recognition) settings
asr:
  # FunASR model names. Every one of these is loaded by name; leaving a model
  # empty skips loading it (online_model is the only required one, plus at
  # least one of offline_model / sense_voice_model).
  #
  # online_model      流式草稿模型。paraformer-zh 是中文模型，英文段落在草稿
  #                   阶段会比较难看 —— 那是红区，本来就会被离线模型改写。
  # sense_voice_model 离线修正的主力。SenseVoiceSmall 是多语言的，自带 ITN
  #                   和标点，中英混说靠它。
  # offline_model     SenseVoice 返回空时的后备（paraformer + ct-punc）。
  #                   显存紧张时可以留空关掉。
  online_model: paraformer-zh-streaming
  sense_voice_model: iic/SenseVoiceSmall
  offline_model: damo/speech_paraformer-large_asr_nat-zh-cn-16k-common-vocab8404-pytorch
  vad_model: damo/speech_fsmn_vad_zh-cn-16k-common-pytorch
  punc_model: damo/punc_ct-transformer_zh-cn-common-vocab272727-pytorch

  # SenseVoice 解码语种: auto | zh | en | yue | ja | ko
  # auto 会启用 SenseVoice 的语种判别头，是中英混说（code-switching）唯一
  # 正确的选项。锁成 zh 会让模型把英文按中文解码。
  language: auto

  # Intermediate result push interval (seconds)
  intermediate_interval: 0.3
  # Compute device: "cuda" (auto-detect GPU 0), "cuda:1" (GPU 1), "mps" (Apple GPU), "cpu"
  device: cuda

# LLM optimization settings (overridable by fcitx5 GUI)
llm:
  # Enable LLM optimization
  enabled: false
  # OpenAI-compatible API endpoint
  base_url: http://localhost:8000/v1
  # API key
  api_key: token-abc123
  # Model name
  model: qwen2.5-7b-instruct
  # Temperature (0.0 - 1.0)
  temperature: 0.3
  # Max output tokens
  max_tokens: 2000
  # Delay before starting LLM optimization (seconds)
  optimize_delay: 0.5
  # Delay before auto-committing after LLM completion (seconds)
  auto_commit_delay: 0.2

# Pipeline — 三区间提交策略
pipeline:
  # 红色块最大字数（超出强制变黄）
  red_max_size: 10
  # 最小提交字数
  min_commit_chars: 10
  # 安全距离（距尾部超过此字数的绿区可提交）
  safe_distance: 50
  # 绿区稳定时间阈值（秒）
  stable_time: 3.0
  # 绿区超限强制提交
  force_commit_size: 150
  # 黄区稳定超时变绿（秒）
  yellow_stable_timeout: 8.0
