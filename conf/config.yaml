# Aoide Backend Configuration
# LLM settings can be overridden via fcitx5 GUI (TriggerKey, LLMBaseUrl, etc.)

backend:
  # Unix Domain Socket path (must match fcitx5 plugin config)
  socket_path: auto  # $XDG_RUNTIME_DIR/aoide/backend.sock

  # Log level: DEBUG, INFO, WARNING, ERROR
  log_level: INFO

# Audio capture settings
audio:
  # Sample rate (Hz)
  sample_rate: 16000
  # Number of channels
  channels: 1
  # Frame size in samples (300ms @ 16kHz)
  frame_size: 4800
  # Audio device name or ID (leave empty for default)
  device: ""

# VAD (Voice Activity Detection) settings
vad:
  # Silence timeout in seconds before segment finalization
  silence_timeout: 0.8
  # Volume threshold (RMS normalized) — 调低以适应低灵敏度麦克风
  volume_threshold: 0.003
  # Leading silence tolerance (seconds before first speech)
  leading_silence_timeout: 3.0

# ASR (Automatic Speech Recognition) settings
asr:
  # FunASR model names. Every one of these is loaded by name; leaving a model
  # empty skips loading it (online_model is the only required one, plus at
  # least one of offline_model / sense_voice_model).
  #
  # online_model      流式草稿模型。paraformer-zh 是中文模型，英文段落在草稿
  #                   阶段会比较难看 —— 那是红区，本来就会被离线模型改写。
  # sense_voice_model 离线修正的主力。SenseVoiceSmall 是多语言的，自带 ITN
  #                   和标点，中英混说靠它。
  # offline_model     SenseVoice 返回空时的后备（paraformer + ct-punc）。
  #                   显存紧张时可以留空关掉。
  #
  # sense_voice_model 这一槽位可以换成 FunASR 支持的任何离线模型，参数
  # (language / use_itn) 通用。在 RTX 5070 Laptop (8GB) 上实测，预热后：
  #
  #   iic/SenseVoiceSmall      ~0.9GB   多语言，中英混说尚可
  #   Qwen/Qwen3-ASR-0.6B      ~1.8GB   3s 音频 0.19s / 10s 音频 0.07s
  #   Qwen/Qwen3-ASR-1.7B      ~4.4GB   3s 音频 0.07s / 10s 音频 0.09s
  #   Whisper-large-v3-turbo            不建议：固定按 30s 窗口推理，
  #                                     3s 音频和 30s 一样贵，配不上这里
  #                                     每 2s 触发一次的增量修正
  #
  # Qwen3-ASR 需要额外装 `pip install -U qwen-asr`，Whisper 需要
  # `pip install -U openai-whisper`。注意 qwen-asr 会把 transformers 降到
  # 4.x —— SenseVoice 和 paraformer 在降级后仍可用，但 venv 会变杂。
  #
  # 1.7B 在 8GB 卡上和桌面会话共存会 OOM（它 4.4GB + 流式模型约 1GB，
  # 再叠上合成器/编辑器的显存就顶穿了）。8GB 机器请用 0.6B。
  #
  # NVIDIA Parakeet 不适用：v2 纯英文、v3 只覆盖欧洲语言，都没有中文。
  online_model: paraformer-zh-streaming
  sense_voice_model: iic/SenseVoiceSmall
  offline_model: damo/speech_paraformer-large_asr_nat-zh-cn-16k-common-vocab8404-pytorch
  vad_model: damo/speech_fsmn_vad_zh-cn-16k-common-pytorch
  punc_model: damo/punc_ct-transformer_zh-cn-common-vocab272727-pytorch

  # SenseVoice 解码语种: auto | zh | en | yue | ja | ko
  # auto 会启用 SenseVoice 的语种判别头，是中英混说（code-switching）唯一
  # 正确的选项。锁成 zh 会让模型把英文按中文解码。
  language: auto

  # Intermediate result push interval (seconds)
  intermediate_interval: 0.3
  # Compute device: "cuda" (auto-detect GPU 0), "cuda:1" (GPU 1), "mps" (Apple GPU), "cpu"
  device: cuda

# LLM optimization settings (overridable by fcitx5 GUI)
llm:
  # Enable LLM optimization
  enabled: false
  # Endpoint. Either an OpenAI-compatible API (https://api.openai.com/v1,
  # vLLM, Ollama, OpenRouter, ...) or Amazon Bedrock as "bedrock:<region>",
  # e.g. bedrock:us-east-1 with model global.anthropic.claude-haiku-4-5-20251001-v1:0
  base_url: http://localhost:8000/v1
  # API key, or env:VARIABLE to read it from the service environment
  # (unused for Bedrock, which uses the AWS profile below)
  api_key: token-abc123
  # Model name (OpenAI: gpt-6-luna / gpt-4.1 / ...; Bedrock: model or inference profile id)
  model: qwen2.5-7b-instruct
  # OpenAI reasoning models only (gpt-5*/gpt-6*/o*): none | low | medium | high.
  # "none" keeps cleanup fast; ignored for non-reasoning models.
  reasoning_effort: ""
  # Bedrock: named profile from ~/.aws (empty = default credential chain)
  aws_profile: ""
  # Seconds to wait for the final cleanup before committing the raw transcript
  timeout: 25
  # true: the fcitx5 addon's LLM fields (URL/key/model/...) override this file
  # on connect. false: this file is authoritative.
  addon_override: true
  # Temperature (0.0 - 1.0)
  temperature: 0.3
  # Max output tokens
  max_tokens: 2000
  # Delay before starting LLM optimization (seconds)
  optimize_delay: 0.5
  # Delay before auto-committing after LLM completion (seconds)
  auto_commit_delay: 0.2

# Cloud speech recognition (optional; used when pipeline.commit_on_release is true).
# Audio leaves the machine only when enabled. Raw (not denoised) audio is sent;
# nothing is written to disk. Every cloud failure falls back to local recognition.
cloud_asr:
  enabled: false
  # Final transcript source:
  #   openai               GPT-Transcribe on VAD segments after release (batch)
  #   openai-realtime      GPT-Live-Transcribe via the OpenAI Realtime session
  #   elevenlabs           ElevenLabs Scribe v2 on VAD segments (batch)
  #   elevenlabs-realtime  final from the Scribe v2 Realtime session
  provider: openai
  # Draft shown while the key is held: local (FunASR) | cloud (the provider
  # vendor's realtime stream; falls back to local mid-utterance on failure)
  draft: local
  api_key: env:AOIDE_OPENAI_API_KEY
  model: gpt-transcribe               # OpenAI batch model
  realtime_model: gpt-live-transcribe # OpenAI streaming model
  languages: [zh, en]                 # OpenAI language hints
  delay: low                          # gpt-live-transcribe: minimal|low|medium|high|xhigh
  prompt: ""                          # extra free-text context for OpenAI
  # Personal dictionary (~/.config/aoide/dictionary.yaml):
  dictionary_prompt: true             # terms as OpenAI batch prompt
  dictionary_keywords: false          # terms as hard keyword bias (realtime keywords, Scribe keyterms)
  timeout: 120                        # batch request budget (s)
  stream_connect_timeout: 5           # WebSocket connect + session setup (s)
  stream_final_timeout: 10            # wait for realtime final after release (s)
  stream_max_failures: 3              # failed sessions before pausing streaming
  stream_cooldown: 600                # pause length (s); auth errors stop until restart
  fallback_batch: true                # realtime final failed -> same vendor batch
  local_fallback: true                # all cloud paths failed -> local Qwen3/SenseVoice
  # Noise suppression for the audio sent to the cloud (stream and batch).
  # Local VAD/drafts always use their own WebRTC copy. Measured 2026-09-22 on
  # noisy public fixtures: no setting clearly beat raw for Scribe; full RNNoise
  # dropped a whole English passage in Scribe Realtime, and both RNNoise modes
  # changed a clean-speech word. webrtc/moderate never hurt Scribe Realtime.
  denoise: none                       # none | webrtc | rnnoise
  denoise_options:
    webrtc_level: moderate            # low | moderate | high | very_high
    high_pass: true
    webrtc_agc: false                 # AGC2 adaptive digital gain for quiet/distant speech
    rnnoise_attenuation_limit_db: 12  # cap noise reduction (wet/dry blend); 0 = unlimited
    rnnoise_vad_threshold: 0          # 0 = no gate; e.g. 0.6 mutes frames below that voice probability
    rnnoise_vad_grace_ms: 200         # keep the gate open this long after voice
    rnnoise_vad_retro_ms: 0           # also open this long before voice (adds equal latency)
  elevenlabs:
    api_key: env:AOIDE_ELEVENLABS_API_KEY
    model: scribe_v2
    realtime_model: scribe_v2_realtime
    language: ""                      # ISO code, empty = auto-detect
    zero_retention: false             # enable_logging=false (enterprise accounts)

# Pipeline — 三区间提交策略
pipeline:
  # 红色块最大字数（超出强制变黄）
  red_max_size: 10
  # 最小提交字数
  min_commit_chars: 10
  # 安全距离（距尾部超过此字数的绿区可提交）
  safe_distance: 50
  # 绿区稳定时间阈值（秒）
  stable_time: 3.0
  # 绿区超限强制提交
  force_commit_size: 150
  # 黄区稳定超时变绿（秒）
  yellow_stable_timeout: 8.0
